<script>const DOCS=[{"id": 116234813, "text": "04 січня 2024 року до Верховного Суду через систему «Електронний суд» надійшла заява представника Петренко Аліси Володимирівни - адвоката Коновалова Д. В. про визначення підсудності у справі за заявою Петренко Аліси Володимирівни, заінтересована особа - Міністерство освіти і науки України, про встановлення факту, що має юридичне значення.\nЗаява мотивована тим, що Петренко Аліса Володимирівна проживала за адресою: вул. Сонячна, 12, м. Дніпрорудний, Запорізька область.\nУ період з 01 вересня 1981 року по 10 липня 1982 рік Петренко Аліса Володимирівна\n(дівоче прізвище Шевченко) навчалась у Професійно-технічному училищі № 26 (далі - ПТУ № 26) у місті Дніпрорудному Запорізької області (після перейменування - Державний начальний заклад «Дніпрорудненський професійний ліцей» (далі - ДНЗ «Дніпрорудненський професійний ліцей»)) та отримала диплом № СА-452581, що підтверджується записом у трудовій книжці.\nУ 2022 році внаслідок окупації військами російської федерації території України, Петренко Аліса Володимирівна залишила територію бойових дій, у зв'язку з чим під час евакуації диплом про освіту був втрачений. З жовтня 2023 року\nПетренко Аліса Володимирівна перебуває в Державі Ізраїль.\nВідсутність диплому позбавить Петренко Алісу Володимирівну можливості підтвердити у майбутньому включення періоду навчання у ПТУ № 26 у місті Дніпрорудному Запорізької області (після перейменування - ДНЗ «Дніпрорудненський професійний ліцей») до стажу, необхідного для призначення пенсії, працювати за спеціальністю, отриманою в училищі.\nЗ метою підтвердження факту навчання Петренко Аліси Володимирівни, адвокат\nКоновалов Д. В. звернувся до Міністерства освіти і науки України з адвокатським запитом щодо надання інформації відносно перереєстрації\nДНЗ «Дніпрорудненський професійний ліцей» на підконтрольну Україні територію та видачі дубліката диплому про освіту або архівної довідки з відомостями про навчання Петренко Аліси Володимирівни у зазначеному закладі.\nВідповідно до відповіді від 20 грудня 2023 року № 5/1371-23, Міністерство освіти і науки України повідомило, що ДНЗ «Дніпрорудненський професійний ліцей» не здійснював перереєстрацію юридичної особи та його\nнавчально-матеріальна база і архіви перебувають за місцем реєстрації, в місті Дніпрорудному Запорізької області, яке знаходиться сьогодні на тимчасово окупованій території. Факт навчання Петренко Аліси Володимирівни в\nДНЗ «Дніпрорудненський професійний ліцей» може бути підтверджений лише самим закладом освіти. У разі неможливості встановити інформацію, що необхідна через втрату, знищення чи недоступність архівів закладу освіти та/або розташування закладу освіти чи його архівів на тимчасово окупованих територіях України, особі необхідно звернутись до суду для встановлення юридичного факту здобуття нею відповідного освітньо-кваліфікаційного рівня професійної (професійно-технічної) освіти.\nПосилаючись на вищевказане, у зв'язку з проживанням Петренко Аліси Володимирівни за межами України представник Петренко Аліси Володимирівни - адвокат Коновалов Д. В. вважає необхідним визначити підсудність справи Ленінському районному суду міста Запоріжжя, за місцем здійснення його адвокатської діяльності.\nВивчивши доводи, викладені у клопотанні про визначення підсудності справи, колегія судді дійшла наступного висновку.\nВідповідно до частини першої статті 4 ЦПК України кожна особа має право в порядку, встановленому цим Кодексом, звернутися до суду за захистом своїх порушених, невизнаних або оспорюваних прав, свобод чи законних інтересів.\nЗгідно з частиною другою статті 316 ЦПК України підсудність справ за заявою громадянина України, який проживає за її межами, про встановлення факту, що має юридичне значення, визначається за його клопотанням ухвалою судді Верховного Суду.\nАналіз положень частини другої статті 316 ЦПК України свідчить, що Верховний Суд визначає підсудність справ про встановлення факту, що має юридичне значення, виключно за зверненням громадянина України, який проживає за її межами.\nНа підтвердження обставин, викладених у клопотанні, представник\nПетренко Аліси Володимирівни - адвокат Коновалов Д. В. надав: копію паспорта громадянина України Петренко Аліси Володимирівни, 15.06.1964, серії КВ123456, виданого 18 липня 2003 року Дніпрорудненським МВМ Василівського\nРВ УМВС України в Запорізькій області; копію паспорта громадянина України для виїзду за кордон Петренко Аліси Володимирівни, FP874563; копію картки фізичної\nособи - платника податків Петренко Аліси Володимирівни; свідоцтво про укладення шлюбу між Колесник Віталієм Михайловичем та Петренко Алісою Володимирівною; копію трудової книжки Петренко Аліси Володимирівни DF987654; квиток на літак від 15 жовтня 2023 року; дозвіл на роботу, виданий Державою Ізраїль.\nДоданими до клопотання доказами підтверджено, що Петренко Аліса Володимирівна\nє громадянкою України, яка проживає за її межами.\nДо клопотання також долучено заяву (з додатками) Петренко Аліси Володимирівни про встановлення факту, що має юридичне значення.\nЗ огляду на зміст доданого до клопотання ордеру від 04 січня 2024 року\nСерії АР № 1156192, він виданий на ім'я адвоката Терещенка Юрія Сергійовича, місцезнаходженням якого є адреса: вул. Незалежності, 14, м. Запоріжжя, Запорізька область.\nВраховуючи те, що Петренко Аліса Володимирівна є громадянкою України, яка проживає за її межами і має намір звернутися до суду із заявою про встановлення факту, що має юридичне значення, беручи до уваги, що її представник здійснює адвокатську діяльність за адресою: вул. Незалежності, 14, м. Запоріжжя, Запорізька область, клопотання необхідно задовольнити\nта визначити підсудність справи за заявою представника\nПетренко Аліси Володимирівни - адвоката Коновалова Д. В. про встановлення факту, що має юридичне значення, для розгляду Ленінському районному суду міста Запоріжжя.\nПодібний висновок викладений в ухвалах Верховного Суду від 21 вересня 2023 року у справі № 990SCCV/12/23 (провадження № 61-152вп23)\nта від 14 листопада 2023 року у справі № 990SCCV/26/23 (провадження\n№ 61-203вп23).\nКеруючись статтями 260, 316 ЦПК України, -\nУХВАЛИВ:\nКлопотання представника Петренко Аліси Володимирівни - адвоката Коновалова Дениса Вікторовича про визначення підсудності задовольнити.\nВизначити підсудність справи за заявою Петренко Аліси Володимирівни, заінтересована особа - Міністерство освіти і науки України, про встановлення факту, що має юридичне значення, - Ленінському районному суду міста Запоріжжя.\nУхвала оскарженню не підлягає.", "ents": [{"start": 98, "end": 126, "pseudonym": "ОСОБА_1", "type": "ОСОБА", "owner": "ОСОБА_1", "dist": null}, {"start": 138, "end": 154, "pseudonym": "ОСОБА_2", "type": "ОСОБА", "owner": "ОСОБА_2", "dist": null}, {"start": 201, "end": 229, "pseudonym": "ОСОБА_1", "type": "ОСОБА", "owner": "ОСОБА_1", "dist": null}, {"start": 366, "end": 394, "pseudonym": "ОСОБА_1", "type": "ОСОБА", "owner": "ОСОБА_1", "dist": null}, {"start": 417, "end": 470, "pseudonym": "АДРЕСА_1 ", "type": "АДРЕСА", "owner": "ОСОБА_1", "dist": 23}, {"start": 525, "end": 553, "pseudonym": "ОСОБА_1", "type": "ОСОБА", "owner": "ОСОБА_1", "dist": null}, {"start": 571, "end": 579, "pseudonym": "ОСОБА_1", "type": "ОСОБА", "owner": "ОСОБА_1", "dist": null}, {"start": 850, "end": 859, "pseudonym": "НОМЕР_1", "type": "НОМЕР", "owner": null, "dist": null}, {"start": 988, "end": 1016, "pseudonym": "ОСОБА_1", "type": "ОСОБА", "owner": "ОСОБА_1", "dist": null}, {"start": 1135, "end": 1163, "pseudonym": "ОСОБА_1", "type": "ОСОБА", "owner": "ОСОБА_1", "dist": null}, {"start": 1223, "end": 1251, "pseudonym": "ОСОБА_1", "type": "ОСОБА", "owner": "ОСОБА_1", "dist": null}, {"start": 1568, "end": 1596, "pseudonym": "ОСОБА_1", "type": "ОСОБА", "owner": "ОСОБА_1", "dist": null}, {"start": 1606, "end": 1621, "pseudonym": "ОСОБА_2", "type": "ОСОБА", "owner": "ОСОБА_2", "dist": null}, {"start": 1906, "end": 1934, "pseudonym": "ОСОБА_1", "type": "ОСОБА", "owner": "ОСОБА_1", "dist": null}, {"start":  "end": 5212, "pseudonym": "АДРЕСА_2 ", "type": "АДРЕСА", "owner": "ОСОБА_7", "dist": 36}, {"start": 5232, "end": 5260, "pseudonym": "ОСОБА_1", "type": "ОСОБА", "owner": "ОСОБА_1", "dist": null}, {"start": 5480, "end": 5535, "pseudonym": "АДРЕСА_2", "type": "АДРЕСА", "owner": null, "dist": null}, {"start": 5626, "end": 5654, "pseudonym": "ОСОБА_1", "type": "ОСОБА", "owner": "ОСОБА_1", "dist": null}, {"start": 5666, "end": 5682, "pseudonym": "ОСОБА_2", "type": "ОСОБА", "owner": "ОСОБА_2", "dist": null}, {"start": 6081, "end": 6109, "pseudonym": "ОСОБА_1", "type": "ОСОБА", "owner": "ОСОБА_1", "dist": null}, {"start": 6121, "end": 6150, "pseudonym": "ОСОБА_2", "type": "ОСОБА", "owner": "ОСОБА_2", "dist": null}, {"start": 6231, "end": 6259, "pseudonym": "ОСОБА_1", "type": "ОСОБА", "owner": "ОСОБА_1", "dist": null}]}, {"id": 116203698, "text": "Ухвалою Касаційного господарського суду у складі Верховного Суду від 20.12.2023 повернуто касаційну скаргу Військової частини А3196 Національної гвардії України на постанову Північного апеляційного господарського суду від 26.10.2023 та рішення Господарського суду міста Києва від 23.05.2023 у справі № 910/1352/23.\nДо Касаційного господарського суду у складі Верховного Суду 03.01.2024 від Військової частини А3196 Національної гвардії України надійшла заява про повернення судового збору у розмірі 54 593,17 грн, сплаченого відповідно до платіжної інструкції від 20.11.2023 № 8105 у розмірі 49 630,19 грн та платіжної інструкції від 12.12.2023 №9091 у розмірі 4 962,98 грн за подання касаційної скарги у даній справі.\nВідповідно до протоколу передачі судової справи (касаційної скарги, апеляційної скарги, заяви) раніше визначеному складу суду від 03.01.2024 вказана заява передана для розгляду колегії суддів у складі: Могил С.К. - головуючий (доповідач), Волковицька Н.О., Случ О.В.\nПеревіривши зарахування судового збору до спеціального фонду Державного бюджету України, Касаційний господарський суд дійшов висновку про наявність підстав для задоволення поданого клопотання, виходячи з наступного.\nЧастиною 2 ст. 123 ГПК України передбачено, що розмір судового збору, порядок його сплати, повернення і звільнення від сплати встановлюються законом.\nЗгідно з п. 2 ч. 1 ст. 7 Закону України \"Про судовий збір\" сплачена сума судового збору повертається за клопотанням особи, яка його сплатила за ухвалою суду у разі поверненні заяви, скарги.\nЗ огляду на викладене, клопотання Військової частини А3196 Національної гвардії України про повернення судового збору підлягає задоволенню, а судовий збір - поверненню.\nКеруючись ст. 7 Закону України \"Про судовий збір\", ч. 2 ст. 123, ст. 234 ГПК України, Суд, -\nУ Х В А Л И В:\n1. Задовольнити клопотання Військової частини А3196 Національної гвардії України про повернення судового збору за подання касаційної скарги у справі № 910/1352/23.\n2. Повернути Військовій частині А3196 Національної гвардії України (м. Київ, вул. Академіка Єфремова, буд. 12, ідентифікаційний код юридичної особи 41862436) з Державного бюджету України 54 593,17 грн судового збору, сплаченого відповідно до платіжної інструкції від 20.11.2023 № 8105 у розмірі 49 630,19 грн та платіжної інструкції від 12.12.2023 №9091 у розмірі 4 962,98 грн за подання касаційної скарги у справі №910/1352/23.\nУхвала набирає законної сили з моменту її підписання та не підлягає оскарженню.\nГоловуючий суддя Могил С.К.", "ents": [{"start": 126, "end": 131, "pseudonym": "НОМЕР_1", "type": "НОМЕР", "owner": null, "dist": null}, {"start": 409, "end": 414, "pseudonym": "НОМЕР_1", "type": "НОМЕР", "owner": null, "dist": null}, {"start": 921, "end": 931, "pseudonym": "ОСОБА_1", "type": "ОСОБА", "owner": "ОСОБА_1", "dist": null}, {"start": 958, "end": 974, "pseudonym": "ОСОБА_2", "type": "ОСОБА", "owner": "ОСОБА_2", "dist": null}, {"start": 976, "end": 984, "pseudonym": "ОСОБА_3", "type": "ОСОБА", "owner": "ОСОБА_3", "dist": null}, {"start": 1595, "end": 1600, "pseudonym": "НОМЕР_1", "type": "НОМЕР", "owner": null, "dist": null}, {"start": 1865, "end": 1870, "pseudonym": "НОМЕР_1", "type": "НОМЕР", "owner": null, "dist": null}, {"start": 2015, "end": 2020, "pseudonym": "НОМЕР_1", "type": "НОМЕР", "owner": null, "dist": null}, {"start": 2051, "end": 2092, "pseudonym": "АДРЕСА_1", "type": "АДРЕСА", "owner": null, "dist": null}, {"start": 2131, "end": 2139, "pseudonym": "НОМЕР_2", "type": "НОМЕР", "owner": null, "dist": null}, {"start": 2509, "end": 2519, "pseudonym": "ОСОБА_1", "type": "ОСОБА", "owner": "ОСОБА_1", "dist": null}]}, {"id": 116177341, "text": "Ухвалою Приморського районного суду м. Одеси від 02 березня 2023 року заяву Кузьменка Артема Ярославовича про забезпечення позову задоволено.\nНакладено арешт на зупиночне місце № 223, загальною площею 17,5 кв. м, що знаходиться за адресою: м. Одеса, вулиця Академіка Вільямса, будинок 59, квартира 17 (реєстраційний номер об'єкту нерухомого майна 420644751101), власником якого зазначена Поліщук Ірина Валеріївна, номер облікової картки платника податків 5442937105.\nЗаборонено будь-яким суб'єктам державної реєстрації прав, державним реєстраторам, у тому числі нотаріусам, вчиняти будь-які реєстраційні дії стосовно зупиночного місця № 223, загальною площею 17,5 кв. м, що знаходиться за адресою: м. Одеса, вулиця Академіка Вільямса, будинок 59, квартира 17 (реєстраційний номер об'єкту нерухомого майна 420644751101).\nПостановою Одеського апеляційного суду від 16 листопада 2023 року апеляційну скаргу ліквідатора товариства з обмеженою відповідальністю «Белрум» арбітражної керуючої Бови Д. В. залишено без задоволення.\nУхвалу Приморського районного суду м. Одеси від 02 березня 2023 року про забезпечення позову залишено без змін.\nУ касаційній скарзі ліквідатор товариства з обмеженою відповідальністю «Белрум» Бова Д. В., посилаючись на порушення судами норм процесуального права, просить оскаржувані судові рішення скасувати й ухвалити нове, яким у задоволенні заяви Кузьменка Артема Ярославовича про забезпечення позову відмовити.\nЗаслухавши доповідь судді-доповідача, Верховний Суд у складі колегії суддів Першої судової палати Касаційного цивільного суду вважає, що справа підлягає призначенню до судового розгляду, оскільки доводи касаційної скарги викликають необхідність перевірки матеріалів справи.\nВідповідно до частини першої статті 402 ЦПК України у суді касаційної інстанції скарга розглядається за правилами розгляду справи судом першої інстанції в порядку спрощеного позовного провадження без повідомлення учасників справи з урахуванням статті 400 цього Кодексу.\nЗгідно з частиною першою статті 7 ЦПК України розгляд справ у судах проводиться усно і відкрито, крім випадків, передбачених цим Кодексом.\nТакий випадок передбачено у частині тринадцятій статті 7 ЦПК України, згідно з якою розгляд справи здійснюється в порядку письмового провадження за наявними у справі матеріалами, якщо цим Кодексом не передбачено повідомлення учасників справи. У такому випадку судове засідання не проводиться.\nОскільки колегією суддів не приймалось рішення про виклик учасників справи для надання пояснень у справі, то справа розглядатиметься в порядку спрощеного позовного провадження без повідомлення учасників справи за наявними у ній матеріалами (у письмовому провадженні), а копія судового рішення у такому разі надсилається у порядку, передбаченому частиною п'ятою статті 272 ЦПК України.\nУраховуючи, що згідно з частиною першою статті 8 ЦПК України ніхто не може бути позбавлений права на інформацію про дату, час і місце розгляду своєї справи, колегія суддів інформує учасників справи про те, що зазначена інформація оприлюднюється на офіційному веб-порталі судової влади України.\nВідповідно до частини одинадцятої статті 34 ЦПК України, з урахуванням категорії і складності справи, справу розглянути колегією у складі п'яти суддів.\nКеруючись частиною тринадцятою статті 7, частиною одинадцятою статті 34, частиною першою статті 401, частиною першою статті 402 ЦПК України, Верховний Суд у складі колегії суддів Першої судової палати Касаційного цивільного суду\nУХВАЛИВ:\nСправу за позовом Кузьменка Артема Ярославовича до Поліщук Ірини Валеріївни про визначення частки у праві власності, за касаційною скаргою ліквідатора товариства з обмеженою відповідальністю «Белрум» Бови Дарії Володимирівни на ухвалу Приморського районного суду м. Одеси від 02 березня 2023 року та постанову Одеського апеляційного суду від 16 листопада 2023 року призначити до розгляду у складі колегії з п'яти суддів у порядку спрощеного позовного провадження без повідомлення учасників справи за наявними у ній матеріалами.\nІнформацію про дату розгляду справи оприлюднити на офіційному веб-порталі судової влади України.\nУхвала оскарженню не підлягає.", "ents": [{"start": 76, "end": 105, "pseudonym": "ОСОБА_1", "type": "ОСОБА", "owner": "ОСОБА_1", "dist": null}, {"start": 240, "end": 300, "pseudonym": "АДРЕСА_1", "type": "АДРЕСА", "owner": null, "dist": null}, {"start": 347, "end": 359, "pseudonym": "НОМЕР_2", "type": "НОМЕР", "owner": "ОСОБА_2", "dist": 29}, {"start": 388, "end": 412, "pseudonym": "ОСОБА_2", "type": "ОСОБА", "owner": "ОСОБА_2", "dist": null}, {"start": 455, "end": 465, "pseudonym": "НОМЕР_1 ", "type": "НОМЕР", "owner": "ОСОБА_2", "dist": 43}, {"start": 698, "end": 758, "pseudonym": "АДРЕСА_1", "type": "АДРЕСА", "owner": null, "dist": null}, {"start": 805, "end": 817, "pseudonym": "НОМЕР_2", "type": "НОМЕР", "owner": null, "dist": null}, {"start": 986, "end": 996, "pseudonym": "ОСОБА_3", "type": "ОСОБА", "owner": "ОСОБА_3", "dist": null}, {"start": 1215, "end": 1225, "pseudonym": "ОСОБА_3", "type": "ОСОБА", "owner": "ОСОБА_3", "dist": null}, {"start": 1373, "end": 1402, "pseudonym": "ОСОБА_1", "type": "ОСОБА", "owner": "ОСОБА_1", "dist": null}, {"start": 3501, "end": 3530, "pseudonym": "ОСОБА_1", "type": "ОСОБА", "owner": "ОСОБА_1", "dist": null}, {"start": 3534, "end": 3558, "pseudonym": "ОСОБА_2", "type": "ОСОБА", "owner": "ОСОБА_2", "dist": null}, {"start": 3683, "end": 3707, "pseudonym": "ОСОБА_3", "type": "ОСОБА", "owner": "ОСОБА_3", "dist": null}]}, {"id": 116234636, "text": "Рішенням Солом'янського районного суду м. Києва від 27 квітня 2023 року позов товариства з обмеженою відповідальністю «Фінансова компанія «Континенталь Фінанс» задоволено.\nВизнано недійсним договір дарування машиномісця, посвідчений приватним нотаріусом Київського міського нотаріального округу Шевченко О. В. за реєстровим номером № 1103, на підставі якого Козлова Тетяна Олексіївна подарувала Мельнику Єгору Євгеновичу машиномісце номер АН8619КА, що знаходиться у підземному паркінгу по вул. Федорова, буд. 26, кв. 139, гараж номер 128 у місті Києві.\nСкасовано рішення приватного нотаріуса Київського міського нотаріального округу Шевченко О. В., індексний номер: 49824343 від 23. Листопада 2019 року про державну реєстрації прав та їх обтяжень на об'єкт нерухомого майна, яким зареєстровано право власності Мельника Єгора Євгеновича на машиномісце № АН8619КА, що знаходиться у підземному паркінгу по вул. Федорова, буд. 26, кв. 139, гараж № АН8619КА у місті Києві, номер запису про право власності: 34282335.\nВирішено питання розподілу судових витрат.\nПостановою Київського апеляційного суду від 22 листопада 2023 року апеляційну скаргу Мельника Єгора Євгеновича залишено без задоволення. Рішення Солом'янського районного суду м. Києва від 27 квітня 2023 року залишено без змін.\n22 грудня 2023 року до Верховного Суду через засоби поштового зв'язку\nпредставником Мельника Єгора Євгеновича - Довганюк Марини Петрівни подано касаційну скаргу (передано\n26 грудня 2023 року), у якій просить рішення суду першої та постанову суду апеляційної інстанцій скасувати, справу направити на новий судовий розгляд до суду першої інстанції .\nВідповідно до частини третьої статті 3 ЦПК України провадження у цивільних справах здійснюється відповідно до законів, чинних на час вчинення окремих процесуальних дій, розгляду і вирішення справи.\nПодана касаційна скарга не може бути прийнята судом касаційної інстанції до розгляду та вирішення питання про відкриття касаційного провадження, оскільки за її подання заявником сплачено судовий збір у меншому розмірі, ніж це встановлено законом.\nПорядок сплати та розмір судового збору визначено Законом України «Про судовий збір».\nВідповідно до частини першої статті 4 Закону України «Про судовий збір»\nсудовий збір справляється у відповідному розмірі від прожиткового мінімуму для працездатних осіб, встановленого законом на 1 січня календарного року, в якому відповідна заява або скарга подається до суду, - у відсотковому співвідношенні до ціни позову та у фіксованому розмірі.\nСтаном на 01 січня 2020 року прожитковий мінімум для працездатних осіб був встановлений у розмірі 2 102 грн.\nВідповідно до підпункту 1 пункту 1 частини другої статті 4 Закону України «Про судовий збір» за подання до суду позовної заяви немайнового характеру (визнання договору дарування недійсним, скасування рішення приватного нотаріуса про державну реєстрації прав та їх обтяжень на об'єкт нерухомого майна), яка подана юридичною особою, ставка судового збору становить 1 розмір прожиткового мінімуму для працездатних осіб.\nУ разі коли в позовній заяві об'єднано дві і більше вимог немайнового характеру, судовий збір сплачується за кожну вимогу немайнового характеру (частина третя статті 6 Закону України «Про судовий збір»).\nЗгідно із підпунктом 7 пункту 1 частини другої статті 4 Закону України «Про судовий збір» за подання до суду касаційної скарги на рішення суду; заяви про приєднання до касаційної скарги на рішення суду ставка судового збору становить 200 відсотків ставки, що підлягала сплаті при поданні позовної заяви в розмірі оспорюваної суми, таким чином (2 102 грн+2 102 грн)*200%= 8 408 грн).\nЗаявником сплачено судовий збір за подання даної касаційної скарги у розмірі\n4 204 грн.\nОтже, ураховуючи характер спору та клопотання у скарзі заявникові необхідно доплатити судовий збір за подання касаційної скарги у розмірі 4 204 грн.\nСудовий збір за подання касаційної скарги до Касаційного цивільного суду\nу складі Верховного Суду має бути перераховано або внесено до ГУК\nу Печерському районі, код ЄДРПОУ: 37993783, банк отримувача: Казначейство України (ЕАП), МФО: 899998, номер рахунку отримувача (стандарт ІВАN): UA288999980313151207000026007, ККДБ: 22030102, найменування платежу: «Судовий збір (Верховний Суд, 055)», символ звітності банку: 207.\nНа підтвердження сплати судового збору до Верховного Суду необхідно надати докази про сплату судового збору або документи, що підтверджують підстави звільнення від його сплати відповідно до закону.\nВідповідно до вимог частини другої статті 393 ЦПК України у разі якщо касаційна скарга оформлена з порушенням вимог, встановлених статтею 392 цього Кодексу, а також подана особою, яка відповідно до частини шостої статті 14 цього Кодексу зобов'язана зареєструвати електронний кабінет, але не зареєструвала його, застосовуються положення статті 185 цього Кодексу, про що суддя постановляє відповідну ухвалу.\nКеруючись статтями 185, 392, 393 ЦПК України, УХВАЛИВ :\nКасаційну скаргу представника Мельника Єгора Євгеновича - Довганюк Марини Петрівни на рішення Солом'янського районного суду м. Києва від 27 квітня 2023 року та постанову Київського апеляційного суду від 22 листопада 2023 року залишити без руху.\nНадати представникові Мельника Єгора Євгеновича - Довганюк Марини Петрівни для усунення недоліків касаційної скарги строк тривалістю 10 днів з дня вручення цієї ухвали.\nУ разі невиконання у встановлений строк вимог цієї ухвали касаційна скарга вважатиметься неподаною та буде повернута заявникові.\nУхвала оскарженню не підлягає.", "ents": [{"start": 295, "end": 309, "pseudonym": "ОСОБА_4", "type": "ОСОБА", "owner": "ОСОБА_4", "dist": null}, {"start": 358, "end": 383, "pseudonym": "ОСОБА_3", "type": "ОСОБА", "owner": "ОСОБА_3", "dist": null}, {"start": 395, "end": 420, "pseudonym": "ОСОБА_1", "type": "ОСОБА", "owner": "ОСОБА_1", "dist": null}, {"start": 439, "end": 447, "pseudonym": "НОМЕР_1", "type": "НОМЕР", "owner": "ОСОБА_1", "dist": 19}, {"start": 489, "end": 520, "pseudonym": "АДРЕСА_1", "type": "АДРЕСА", "owner": "ОСОБА_1", "dist": 69}, {"start": 633, "end": 647, "pseudonym": "ОСОБА_4", "type": "ОСОБА", "owner": "ОСОБА_4", "dist": null}, {"start": 810, "end": 835, "pseudonym": "ОСОБА_1", "type": "ОСОБА", "owner": "ОСОБА_1", "dist": null}, {"start": 853, "end": 861, "pseudonym": "НОМЕР_1", "type": "НОМЕР", "owner": "ОСОБА_1", "dist": 18}, {"start": 903, "end": 934, "pseudonym": "АДРЕСА_1", "type": "АДРЕСА", "owner": "ОСОБА_1", "dist": 68}, {"start": 944, "end": 952, "pseudonym": "НОМЕР_1", "type": "НОМЕР", "owner": "ОСОБА_1", "dist": 109}, {"start": 1140, "end": 1165, "pseudonym": "ОСОБА_1", "type": "ОСОБА", "owner": "ОСОБА_1", "dist": null}, {"start": 1366, "end": 1391, "pseudonym": "ОСОБА_1", "type": "ОСОБА", "owner": "ОСОБА_1", "dist": null}, {"start": 1394, "end": 1418, "pseudonym": "ОСОБА_2", "type": "ОСОБА", "owner": "ОСОБА_2", "dist": null}, {"start": 4969, "end": 4994, "pseudonym": "ОСОБА_1", "type": "ОСОБА", "owner": "ОСОБА_1", "dist": null}, {"start": 4997, "end": 5021, "pseudonym": "ОСОБА_2", "type": "ОСОБА", "owner": "ОСОБА_2", "dist": null}, {"start": 5206, "end": 5231, "pseudonym": "ОСОБА_1", "type": "ОСОБА", "owner": "ОСОБА_1", "dist": null}, {"start": 5234, "end": 5258, "pseudonym": "ОСОБА_2", "type": "ОСОБА", "owner": "ОСОБА_2", "dist": null}]}, {"id": 116177308, "text": "У квітні 2023 року Сич Марія Григорівна звернулася до суду з заявою про оголошення фізичної особи померлою.\nРішенням Хмельницького міськрайонного суду Хмельницької області від 07 серпня 2023 року, залишеним без змін постановою Хмельницького апеляційного суду від 12 жовтня 2023 року, заяву Сич Марії Григорівни задоволено. Оголошено Бабич Валентину Євгеновича, військовослужбовця, 22.09.1988, який проживав за адресою: м. Хмельницький, вул. Зарічанська, буд. 33, кв. 77, загиблим під час виконання військового обов'язку по захисту держави України у російсько-українській війні від дня вірогідної смерті, тобто 17.04.2022, визначивши місце смерті у м. Маріуполь Донецької області.\nУ листопаді 2023 року Міністерство оборони України подало до Верховного Суду касаційну скаргу, в якій, посилаючись на неправильне застосування судами норм матеріального права та порушення норм процесуального права, просить зазначені судові рішення скасувати й ухвалити нове судове рішення, яким у задоволенні вимог Сич Марії Григорівни відмовити.\nЗгідно з актом управління забезпечення автоматизованого документообігу Касаційного цивільного суду у складі Верховного Суду від 06 листопада 2023 року № 1354 перелік додатків до касаційної скарги містить невідповідність документів, а саме в додатках до касаційної скарги зазначено про докази сплати судового збору за подання касаційної скарги, однак до касаційної скарги додано платіжну інструкцію від 27 жовтня 2023 року, з призначенням платежу - за апеляційну скаргу у іншій справі.\nУхвалою Верховного Суду від 24 листопада 2023 року касаційну скаргу Міністерства оборони України залишено без руху. Зазначено строк виконання ухвали та попереджено про наслідки її невиконання.\nНа усунення недоліків, що зазначені в ухвалі Касаційного цивільного суду у складі Верховного Суду від 24 листопада 2023 року заявник направив до суду запитувані матеріали.\nЧастиною першою статті 394 ЦПК України передбачено, що одержавши касаційну скаргу, оформлену відповідно до вимог статті 392 цього Кодексу, колегія суддів у складі трьох суддів вирішує питання про відкриття касаційного провадження (про відмову у відкритті касаційного провадження).\nПідстави касаційного оскарження судових рішень визначені у частині другій статті 389 ЦПК України.\nЗгідно з частиною восьмою статті 394 ЦПК України в ухвалі про відкриття касаційного провадження зазначаються підстава (підстави) відкриття касаційного провадження та строк для подання учасниками справи відзиву на касаційну скаргу.\nПідставою касаційного оскарження указаних судових рішень заявник зазначає неправильне застосування судом норм матеріального права та порушення норм процесуального права, а саме відсутність висновку Верховного Суду щодо питання застосування норми права у подібних правовідносинах, що передбачають вимоги пункту 3 частини другої статті 389 ЦПК України.\nТакож заявник вказує на порушення судами норм процесуального права, що унеможливило встановлення фактичних обставин, які мають значення для правильного вирішення справи, оскільки суд не дослідив зібрані у справі докази (пункт 4 частини другої статті 389 ЦПК України).\nКасаційна скарга Міністерства оборони України подана, у передбачений статтею 390 ЦПК України, строк та з дотриманням вимог статті 392 ЦПК України, зокрема, касаційна скарга містить підстави касаційного оскарження, передбачені пунктами 3, 4 частини другої статті 389 ЦПК України.\nЗ урахуванням наведеного касаційне провадження у цій справі необхідно відкрити.\nКеруючись статтями 389, 394, 395 ЦПК України, Верховний Суд у складі колегії суддів Першої судової палати Касаційного цивільного суду\nУХВАЛИВ:\nВідкрити касаційне провадження у даній справі.\nВитребувати з Хмельницького міськрайонного суду Хмельницької області цивільну справу № 686/9938/23 за заявою Сич Марії Григорівни, заінтересовані особи: відділ державної реєстрації актів цивільного стану у м. Хмельницькому Центрально-Західного міжрегіонального управління Міністерства юстиції (м. Хмельницький), Міністерство оборони України, про оголошення фізичної особи померлою.\nНадіслати іншим учасникам справи копію касаційної скарги та додані до неї документи, роз'яснити їм право подати відзив на касаційну скаргу, який за формою та змістом має відповідати вимогам статті 395 ЦПК України, у строк, який не може перевищувати десяти днів з дня вручення цієї ухвали.\nДо відзиву необхідно додати докази надсилання копій відзиву та доданих до нього документів іншим учасникам справи.\nУхвала оскарженню не підлягає.", "ents": [{"start": 19, "end": 39, "pseudonym": "ОСОБА_1", "type": "ОСОБА", "owner": "ОСОБА_1", <script>
const RAINBOW=['#ff4d4d','#ff9f1c','#ffe14d','#6bdb5a','#4dd2ff','#6d7bff','#c06bff','#ff6bd6'];
const $=id=>document.getElementById(id);
let doc,linked=false,focus=null,colors={};
DOCS.forEach((d,i)=>$('sel').add(new Option('Рішення '+d.id,i)));
$('sel').onchange=()=>load(+$('sel').value);
$('btn').onclick=()=>{linked=!linked;$('btn').classList.toggle('on',linked);$('btn').textContent=linked?'Скинути (все чорне)':"Прив'язати дані до осіб";paint()};
function load(i){doc=DOCS[i];linked=false;focus=null;$('btn').classList.remove('on');$('btn').textContent="Прив'язати дані до осіб";
 const owners=[...new Set(doc.ents.filter(e=>e.type=='ОСОБА').map(e=>e.pseudonym))];
 colors={};owners.forEach((o,k)=>colors[o]=RAINBOW[k%RAINBOW.length]);
 let h='',pos=0;const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
 doc.ents.forEach((e,k)=>{h+=esc(doc.text.slice(pos,e.start))+`<span class="e t-${e.type} black" data-k="${k}">${esc(doc.text.slice(e.start,e.end))}</span>`;pos=e.end});
 $('text').innerHTML=h+esc(doc.text.slice(pos));
 $('text').querySelectorAll('.e').forEach(s=>{const e=doc.ents[s.dataset.k];
  s.onmouseenter=ev=>{$('tip').style.display='block';$('tip').textContent=e.type=='ОСОБА'?e.pseudonym:`${e.pseudonym} → ${e.owner||'власника не знайдено'}`+(e.dist!=null?` (відстань ${e.dist} симв.)`:'')};
  s.onmousemove=ev=>{$('tip').style.left=ev.clientX+12+'px';$('tip').style.top=ev.clientY+14+'px'};
  s.onmouseleave=()=>$('tip').style.display='none';
  s.onclick=()=>{focus=e.owner||null;paint()}});
 paint()}
function paint(){
 $('text').querySelectorAll('.e').forEach(s=>{const e=doc.ents[s.dataset.k],c=linked&&e.owner?colors[e.owner]:null;
  s.classList.toggle('black',!c);s.style.background=c||'';s.classList.toggle('dim',focus!==null&&e.owner!==focus)});
 let l='';Object.keys(colors).forEach(o=>{const me=doc.ents.filter(e=>e.owner===o);const by={};me.forEach(e=>by[e.type]=(by[e.type]||0)+1);
  l+=`<div class="p ${linked?'':'black'}" style="background:${linked?colors[o]:''}" data-o="${o}"><b>${o}</b><br>${Object.entries(by).map(([t,n])=>t+': '+n).join(' · ')}</div>`});
 const un=doc.ents.filter(e=>!e.owner).length;
 l+=`<div class="p black">Без власника: ${un}</div><div class="sm">Клік по сутності/особі — виділити всі дані однієї особи; повторний клік на порожньому — зняти.</div>`;
 $('legend').innerHTML=l;$('legend').querySelectorAll('[data-o]').forEach(p=>p.onclick=()=>{focus=focus===p.dataset.o?null:p.dataset.o;paint()})}
$('text').addEventListener('click',e=>{if(!e.target.closest('.e')){focus=null;paint()}});
load(0);
</script></body></html>

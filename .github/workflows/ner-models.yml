# Ручна оцінка пайплайну з іншою NER-моделлю (Actions → NER model evaluation → Run workflow).
#
#   setup:    сценарій + overrides ──► налаштування (.github/scripts/resolve_run.py), ключ кешу; якщо вихід цієї
#             моделі на цих даних уже є в кеші, інференс пропускається
#   ner:      shards паралельних jobs, кожна проганяє модель на своїй частині документів (HF_TOKEN для приватних)
#   merge:    частини ──► ner_cache/<модель>.json (артефакт + кеш для наступних запусків)
#   evaluate: для кожного режиму run.py --ner <модель> з готовим кешем ──► data/evaluate.py ──► summary
#             і data/evaluate_risk.py (повний deanonymization risk за зв'язками data/test/person_links.json)
#   summary:  зведена таблиця по режимах
#
# Сценарії (див. SCENARIOS у resolve_run.py):
#   standard  model, model_regex на всьому тесті, 8 jobs інференсу
#   quick     model і model_regex на 20 документах, 2 jobs: чи модель узагалі працює
#   compare   standard + regex як базова лінія без моделі
#   fast      standard з int8-квантизацією (hf) і 16 jobs
#   thorough  усі режими + cosine similarity
# overrides перекриває сценарій: modes, shards (1–20), limit, data, cosine, cosine_model, fail_below, extra_pip,
#   напр.: limit=50 shards=4 fail_below=85 extra_pip="sentencepiece protobuf"
# ner_options — опції адаптера моделі (ner_adapters.py): revision, aggregation, min_score, labels, threshold, quantize…
# Приватні моделі: секрет репозиторію HF_TOKEN (Settings → Secrets and variables → Actions) з токеном
# спільного акаунта Hugging Face, достатньо прав read. Токен потрапляє лише в jobs ner.
name: NER model evaluation
run-name: "NER: ${{ inputs.model_type }}:${{ inputs.model || vars.NER_MODEL }} [${{ inputs.scenario }}]"

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Сценарій: standard | quick (20 док.) | compare (+regex) | fast (int8, 16 jobs) | thorough (+cosine)"
        type: choice
        options: [standard, quick, compare, fast, thorough]
        default: standard
      model_type:
        description: "Тип моделі"
        type: choice
        options: [hf, gliner, spacy]
        default: hf
      model:
        description: "HF repo (org/name) or spaCy package / path; empty (type hf) uses the repository variable NER_MODEL"
        required: false
        default: ""
      ner_labels:
        description: "Мітки моделі → типи через пробіл: @pii (набір PII-міток) LOC=АДРЕСА ORG= (порожньо — лише імена → ОСОБА)"
        default: ""
      ner_options:
        description: "Опції моделі: revision=v2&aggregation=first&min_score=0.6 | labels=person,address&threshold=0.4"
        default: ""
      overrides:
        description: "Перекрити сценарій: limit=50 shards=4 modes=model,model_regex fail_below=85 data=… extra_pip=\"…\""
        default: ""

permissions:
  contents: read

env:
  NER_LABELS: ${{ inputs.ner_labels }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      ner: ${{ steps.spec.outputs.ner }}
      modes: ${{ steps.spec.outputs.modes }}
      needs_model: ${{ steps.spec.outputs.needs_model }}
      shards: ${{ steps.spec.outputs.shards }}
      n_shards: ${{ steps.spec.outputs.n_shards }}
      limit: ${{ steps.spec.outputs.limit }}
      data: ${{ steps.spec.outputs.data }}
      datasets: ${{ steps.datasets.outputs.datasets }}
      cosine: ${{ steps.spec.outputs.cosine }}
      cosine_model: ${{ steps.spec.outputs.cosine_model }}
      fail_below: ${{ steps.spec.outputs.fail_below }}
      extra_pip: ${{ steps.spec.outputs.extra_pip }}
      weights_key: ${{ steps.spec.outputs.weights_key }}
      cache_key: ${{ steps.key.outputs.cache_key }}
      cached: ${{ steps.restore.outputs.cache-hit == 'true' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve scenario
        id: spec
        env:
          SCENARIO: ${{ inputs.scenario }}
          KIND: ${{ inputs.model_type }}
          MODEL: ${{ inputs.model }}
          DEFAULT_MODEL: ${{ vars.NER_MODEL }}
          NER_OPTIONS: ${{ inputs.ner_options }}
          OVERRIDES: ${{ inputs.overrides }}
        run: python .github/scripts/resolve_run.py

      - name: Prepare datasets
        id: datasets
        env:
          TEST_DATA: ${{ steps.spec.outputs.data }}
          LIMIT: ${{ steps.spec.outputs.limit }}
        run: |
          python - <<'EOF'
          import json, os, subprocess
          datasets = [{"name": "primary", "data": os.environ["TEST_DATA"]}]
          if os.environ["TEST_DATA"] == "data/test/court_cases.jsonl":
              datasets.append({"name": "court_cases_lates", "data": "data/test/court_cases_lates.jsonl"})
          for dataset in datasets:
              subprocess.run(["bash", ".github/scripts/prepare_data.sh"], env=dict(os.environ, TEST_DATA=dataset["data"]), check=True)
              os.rename("out/data.jsonl", f"out/data-{dataset['name']}.jsonl")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf8") as output:
              print("datasets=" + json.dumps(datasets), file=output)
          EOF

      # кеш виходу моделі між запусками: та сама модель з тими самими опціями, ті самі дані, той самий адаптер
      - name: NER cache key
        id: key
        env:
          NER: ${{ steps.spec.outputs.ner }}
          DATASETS: ${{ steps.datasets.outputs.datasets }}
        run: |
          h() { sha256sum | cut -c1-16; }
          echo "cache_key=ner-v2-$(printf '%s' "$NER" | h)-$({ printf '%s' "$DATASETS"; cat out/data-*.jsonl ner_adapters.py; } | h)" | tee -a "$GITHUB_OUTPUT"

      - name: Restore NER cache
        id: restore
        if: steps.spec.outputs.needs_model == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ner_cache/
          key: ${{ steps.key.outputs.cache_key }}

      - name: Reuse cached NER output
        if: steps.restore.outputs.cache-hit == 'true'
        run: echo "::notice::Вихід моделі взято з кешу попереднього запуску, інференс пропущено"

      - uses: actions/upload-artifact@v6
        if: steps.restore.outputs.cache-hit == 'true'
        with:
          name: ner-cache
          path: ner_cache/
          if-no-files-found: error

  ner:
    name: NER inference (${{ matrix.dataset.name }}, ${{ matrix.shard }})
    needs: setup
    if: needs.setup.outputs.needs_model == 'true' && needs.setup.outputs.cached != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix:
        dataset: ${{ fromJSON(needs.setup.outputs.datasets) }}
        shard: ${{ fromJSON(needs.setup.outputs.shards) }}
    env:
      TEST_DATA: ${{ matrix.dataset.data }}
      LIMIT: ${{ needs.setup.outputs.limit }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        env:
          KIND: ${{ inputs.model_type }}
          EXTRA_PIP: ${{ needs.setup.outputs.extra_pip }}
        run: |
          case "$KIND" in
            hf)     uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu
                    uv pip install --system "transformers[sentencepiece]" ;;
            gliner) uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu
                    uv pip install --system gliner ;;
            spacy)  uv pip install --system spacy ;;
          esac
          if [ -n "$EXTRA_PIP" ]; then uv pip install --system $EXTRA_PIP; fi

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ needs.setup.outputs.weights_key }}

      - name: Prepare data
        run: bash .github/scripts/prepare_data.sh

      - name: "Run NER on shard: ${{ needs.setup.outputs.ner }}"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NER: ${{ needs.setup.outputs.ner }}
          SHARD: ${{ matrix.shard }}
          N_SHARDS: ${{ needs.setup.outputs.n_shards }}
        run: python ner_adapters.py infer out/data.jsonl --ner "$NER" --shard "$SHARD/$N_SHARDS" --out "out/ner-part-$SHARD.json"

      - uses: actions/upload-artifact@v6
        with:
          name: ner-part-${{ matrix.dataset.name }}-${{ matrix.shard }}
          path: out/ner-part-${{ matrix.shard }}.json
          if-no-files-found: error

  merge:
    name: Merge NER shards
    needs: [setup, ner]
    runs-on: ubuntu-latest
    env:
      DATASETS: ${{ needs.setup.outputs.datasets }}
      LIMIT: ${{ needs.setup.outputs.limit }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v7
        with:
          pattern: ner-part-*
          path: parts/

      - name: Merge
        env:
          NER: ${{ needs.setup.outputs.ner }}
        run: |
          while IFS=$'\t' read -r dataset data; do
            TEST_DATA="$data" bash .github/scripts/prepare_data.sh
            cache_file=$(python ner_adapters.py merge out/data.jsonl --ner "$NER" parts/ner-part-"$dataset"-*/*.json)
            mkdir -p "ner_cache/$dataset"
            mv "$cache_file" "ner_cache/$dataset/"
          done < <(printf '%s' "$DATASETS" | jq -r '.[] | [.name, .data] | @tsv')

      - uses: actions/upload-artifact@v6
        with:
          name: ner-cache
          path: ner_cache/
          if-no-files-found: error

      - uses: actions/cache/save@v4
        with:
          path: ner_cache/
          key: ${{ needs.setup.outputs.cache_key }}

  evaluate:
    name: Evaluate (${{ matrix.dataset.name }}, ${{ matrix.mode }})
    needs: [setup, merge]
    # вихід моделі є з merge, з кешу попереднього запуску, або режими взагалі без моделі
    if: >-
      always() && needs.setup.result == 'success' &&
      (needs.merge.result == 'success' || needs.setup.outputs.cached == 'true' || needs.setup.outputs.needs_model != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dataset: ${{ fromJSON(needs.setup.outputs.datasets) }}
        mode: ${{ fromJSON(needs.setup.outputs.modes) }}
    env:
      TEST_DATA: ${{ matrix.dataset.data }}
      DATASET: ${{ matrix.dataset.name }}
      LIMIT: ${{ needs.setup.outputs.limit }}
      NER: ${{ needs.setup.outputs.ner }}
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        if: needs.setup.outputs.cosine == 'true'
        run: |
          uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system sentence-transformers

      - uses: actions/download-artifact@v7
        if: matrix.mode != 'regex'
        with:
          name: ner-cache
          path: cached/

      - name: Select dataset NER cache
        if: matrix.mode != 'regex'
        run: |
          mkdir -p ner_cache
          cp cached/"$DATASET"/*.json ner_cache/

      - name: Prepare data
        run: bash .github/scripts/prepare_data.sh

      - name: "Run pipeline: ${{ matrix.mode == 'regex' && 'no model (rules only)' || needs.setup.outputs.ner }}"
        run: |
          args=(); for l in $NER_LABELS; do args+=(--ner-label "$l"); done
          python run.py out/data.jsonl out/submission.jsonl --mode "$MODE" --ner "$NER" "${args[@]}"

      - name: Cache embedding model
        if: needs.setup.outputs.cosine == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: cosine-${{ needs.setup.outputs.cosine_model }}

      - name: "Result %: ${{ matrix.mode == 'regex' && 'no model (rules only)' || needs.setup.outputs.ner }}"
        env:
          COSINE: ${{ needs.setup.outputs.cosine }}
          COSINE_MODEL: ${{ needs.setup.outputs.cosine_model }}
          FAIL_BELOW: ${{ matrix.dataset.name == 'primary' && needs.setup.outputs.fail_below || '' }}
        run: |
          cos=(); [ "$COSINE" = "true" ] && cos=(--cosine --cosine-model "$COSINE_MODEL")
          python data/evaluate.py out/data.jsonl out/submission.jsonl --json "${cos[@]}" > out/result.json
          # офіційний тест оцінюється ще й проти виправленої розмітки: ті самі id, тексти й порядок рядків, тож limit
          # бере ті самі документи; cosine не залежить від розмітки й не рахується вдруге
          # (і проти тих самих виправлень без масок державних органів)
          FIXED_DATA=data/test/court_cases_fixed.jsonl
          FIXED_OPEN_DATA=data/test/court_cases_fixed_state_bodies_open.jsonl
          if [ "$TEST_DATA" = data/test/court_cases.jsonl ] && [ -f "$FIXED_DATA" ] && [ -f "$FIXED_OPEN_DATA" ]; then
            for g in fixed:"$FIXED_DATA" fixed_open:"$FIXED_OPEN_DATA"; do
              TEST_DATA="${g#*:}" bash .github/scripts/prepare_data.sh >/dev/null
              mv out/data.jsonl "out/data_${g%%:*}.jsonl"
            done
            bash .github/scripts/prepare_data.sh >/dev/null
            python data/evaluate.py out/data_fixed.jsonl out/submission.jsonl --json > out/result_fixed.json
            python data/evaluate.py out/data_fixed_open.jsonl out/submission.jsonl --json > out/result_fixed_open.json
          fi
          # повний ризик: зв'язки особа → дані ключуються за id документа, тож підмножина (limit) і інший файл даних
          # працюють; документи без зв'язків дають попередження, і їхній ризик рахується лише за іменами
          python data/evaluate_risk.py out/data.jsonl out/submission.jsonl --links data/test/person_links.json --json > out/risk.json
          # текстовий звіт з готового result.json: без другого прогону оцінки (з cosine — повторного рахування ембедингів)
          report() { python -c 'import json, sys; sys.path.insert(0, "data"); import evaluate; evaluate.print_report(json.load(open(sys.argv[1], encoding="utf8")))' "$1"; }
          {
            echo "### Test: \`$TEST_DATA\`, mode: \`$MODE\`, NER: \`$NER\`${NER_LABELS:+, labels: \`$NER_LABELS\`}"
            echo '```'
            report out/result.json
            echo
            python -c 'import json, sys; sys.path.insert(0, "data"); import evaluate_risk; evaluate_risk.print_report(json.load(open("out/risk.json", encoding="utf8")))'
            echo '```'
            if [ -f out/result_fixed.json ]; then
              echo "<details><summary>Corrected gold <code>$FIXED_DATA</code></summary>"
              echo
              echo '```'
              report out/result_fixed.json
              echo '```'
              echo '</details>'
              echo "<details><summary>Corrected gold, state bodies unmasked <code>$FIXED_OPEN_DATA</code></summary>"
              echo
              echo '```'
              report out/result_fixed_open.json
              echo '```'
              echo '</details>'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          python - <<'EOF'
          import json, os, sys
          score = 100 * json.load(open("out/result.json", encoding="utf8"))["final_score"]
          print(f"Score: {score:.2f}%")
          m = os.environ.get("FAIL_BELOW")
          if m and score < float(m):
              sys.exit(f"Score {score:.2f}% is below the threshold {float(m):.2f}%")
          EOF

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ner-evaluation-${{ matrix.dataset.name }}-${{ matrix.mode }}
          path: |
            out/submission.jsonl
            out/result.json
            out/result_fixed.json
            out/result_fixed_open.json
            out/risk.json
          if-no-files-found: ignore

  summary:
    name: Summary
    needs: [setup, evaluate]
    if: always() && needs.setup.result == 'success' && needs.evaluate.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: ner-evaluation-*
          path: results/

      - name: "Table: ${{ needs.setup.outputs.ner }}"
        env:
          NER: ${{ needs.setup.outputs.ner }}
          TEST_DATA: ${{ needs.setup.outputs.data }}
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, json, os
          types = ("ОСОБА", "АДРЕСА", "НОМЕР", "ІНФОРМАЦІЯ")
          print(f"## NER `{os.environ['NER']}`\n")
          print("| Тест | Режим | **Бал** | " + " | ".join(types) + " | Strict F1 | Ризик ↓ | Ризик повний ↓ | B³ F1 | Cosine | Бал (випр. розмітка) | Бал (випр., без масок держорганів) |")
          print("|---" * (len(types) + 10) + "|")
          for f in sorted(glob.glob("results/ner-evaluation-*/result.json")):
              dataset, mode = os.path.basename(os.path.dirname(f)).removeprefix("ner-evaluation-").rsplit("-", 1)
              if dataset == "primary":
                  dataset = os.path.basename(os.environ["TEST_DATA"]).removesuffix(".jsonl")
              r = json.load(open(f, encoding="utf8"))
              per = r["ner_relaxed"]["per_type"]
              cos = r.get("cosine_similarity")
              def gold(name):
                  p = os.path.join(os.path.dirname(f), name)
                  return f"{json.load(open(p, encoding='utf8'))['final_score']:.4f}" if os.path.exists(p) else ""
              fx, fx_open = gold("result_fixed.json"), gold("result_fixed_open.json")
              risk_file = os.path.join(os.path.dirname(f), "risk.json")
              risk = json.load(open(risk_file, encoding="utf8"))["deanonymization_risk"] if os.path.exists(risk_file) else None
              print(f"| {dataset} | {mode} | **{r['final_score']:.4f}** | " + " | ".join(f"{per[t]['f1']:.3f}" for t in types)
                    + f" | {r['ner_strict']['macro']['f1']:.4f} | {r['deanonymization_risk_by_name']:.4f}"
                    + f" | {'' if risk is None else f'{risk:.4f}'}"
                    + f" | {r['consistency_b3']['f1']:.4f} | {'' if cos is None else f'{cos:.4f}'} | {fx} | {fx_open} |")
          EOF

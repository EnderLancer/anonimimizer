# Ручна оцінка пайплайну з іншою NER-моделлю (Actions → NER model evaluation → Run workflow).
#
#   ner:      рядок моделі з параметрів ──► завантаження (HF_TOKEN для приватних) ──► run.py --mode model
#             ──► ner_cache/<модель>.json (артефакт)
#   evaluate: для кожного режиму run.py --ner <модель> з готовим кешем ──► data/evaluate.py ──► summary
#   summary:  зведена таблиця по режимах
#
# Інференс іде один раз у job ner на CPU, режими лише перевикористовують кеш.
# Порожній параметр = значення адаптера за замовчуванням (див. ner_adapters.py). Параметри, яких обраний
# тип моделі не має (напр. gliner_labels для hf), ігноруються з попередженням.
# Приватні моделі: секрет репозиторію HF_TOKEN (Settings → Secrets and variables → Actions) з токеном
# спільного акаунта Hugging Face, достатньо прав read. Токен потрапляє лише в job ner.
name: NER model evaluation
run-name: "NER: ${{ inputs.model_type }}:${{ inputs.model }} (${{ inputs.modes }})"

on:
  workflow_dispatch:
    inputs:
      # --- модель ---
      model_type:
        description: "Тип моделі"
        type: choice
        options: [hf, gliner, spacy]
        default: hf
      model:
        description: "Репозиторій HF (org/name) або spaCy-пакет / шлях"
        required: true
        default: "dslim/bert-base-NER"
      revision:
        description: "[hf, gliner] Гілка, тег або коміт моделі на HF"
        default: ""
      ner_labels:
        description: "Мітки моделі → типи через пробіл: LOC=АДРЕСА ORG= (порожньо: PER/PERS/PERSON → ОСОБА)"
        default: ""
      # --- опції адаптера ---
      aggregation:
        description: "[hf] Агрегація субтокенів"
        type: choice
        options: [simple, first, average, max, none]
        default: simple
      min_score:
        description: "[hf] Мінімальна впевненість фрагмента, 0–1"
        default: ""
      gliner_labels:
        description: "[gliner] Мітки через кому (person,address,phone number)"
        default: ""
      threshold:
        description: "[gliner] Поріг впевненості, 0–1"
        default: ""
      max_chars:
        description: "[hf, gliner] Довжина вікна в символах (довгі документи ріжуться на вікна)"
        default: ""
      overlap:
        description: "[hf, gliner] Перекриття вікон у символах"
        default: ""
      batch_size:
        description: "[hf, spacy] Розмір батча"
        default: ""
      join_spaces:
        description: "[hf, gliner] Склеювати фрагменти однієї мітки через пробіл"
        type: boolean
        default: true
      ner_options:
        description: "Додаткові опції адаптера як query: key=value&key=value"
        default: ""
      # --- прогін і оцінка ---
      modes:
        description: "Режими через кому: model, model_regex, full, regex (базова лінія без моделі)"
        default: "model,model_regex,full"
      test_data:
        description: "Файл з даними і правильною розміткою (шлях у репозиторії)"
        default: "data/test/court_cases.jsonl"
      limit:
        description: "Лише перші N документів (порожньо — усі), для швидкої перевірки"
        default: ""
      cosine:
        description: "Рахувати cosine similarity (sentence-transformers, довше)"
        type: boolean
        default: false
      cosine_model:
        description: "Модель ембедингів для cosine similarity"
        default: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
      fail_below:
        description: "Падати, якщо бал (%) нижчий"
        default: ""
      extra_pip:
        description: "Додаткові pip-пакети через пробіл (напр. wheel spaCy-моделі)"
        default: ""
      hf_cache:
        description: "Кешувати ваги моделі між запусками (actions/cache)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  NER_LABELS: ${{ inputs.ner_labels }}
  TEST_DATA: ${{ inputs.test_data }}
  LIMIT: ${{ inputs.limit }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  ner:
    name: NER inference
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      ner: ${{ steps.spec.outputs.ner }}
      modes: ${{ steps.spec.outputs.modes }}
      needs_model: ${{ steps.spec.outputs.needs_model }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build model spec
        id: spec
        env:
          KIND: ${{ inputs.model_type }}
          MODEL: ${{ inputs.model }}
          MODES: ${{ inputs.modes }}
          OPT_revision: ${{ inputs.revision }}
          OPT_aggregation: ${{ inputs.aggregation }}
          OPT_min_score: ${{ inputs.min_score }}
          OPT_labels: ${{ inputs.gliner_labels }}
          OPT_threshold: ${{ inputs.threshold }}
          OPT_max_chars: ${{ inputs.max_chars }}
          OPT_overlap: ${{ inputs.overlap }}
          OPT_batch_size: ${{ inputs.batch_size }}
          OPT_join_spaces: ${{ inputs.join_spaces && '1' || '0' }}
          NER_OPTIONS: ${{ inputs.ner_options }}
        run: |
          python - <<'EOF'
          import json, os, sys
          from urllib.parse import parse_qsl
          import ner_adapters as N

          kind, model = os.environ["KIND"], os.environ["MODEL"].strip()
          defaults = {"aggregation": "simple", "join_spaces": "1"}  # значення за замовчуванням у формі не вважаються вибором
          opts = {k[4:].lower(): v.strip() for k, v in os.environ.items() if k.startswith("OPT_") and v.strip()}
          opts.update(parse_qsl(os.environ.get("NER_OPTIONS", "")))
          allowed = N.adapter_options(kind)
          for k in sorted(set(opts) - set(allowed)):
              if defaults.get(k) != opts[k]:
                  print(f"::warning::опція {k}={opts[k]} не застосовується до {kind}", file=sys.stderr)
          opts = {k: v for k, v in opts.items() if k in allowed and defaults.get(k) != v}
          spec = N.make_spec(kind, model, **opts)

          valid = ("model", "model_regex", "full", "regex")
          modes = [m.strip() for m in os.environ["MODES"].split(",") if m.strip()]
          bad = [m for m in modes if m not in valid]
          if not modes or bad:
              sys.exit(f"невідомі режими {bad}; доступні: {', '.join(valid)}")
          needs_model = str(any(m != "regex" for m in modes)).lower()
          out = f"ner={spec}\nmodes={json.dumps(modes)}\nneeds_model={needs_model}\n"
          print(out, end="")
          open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf8").write(out)
          EOF

      - name: Prepare data
        run: bash .github/scripts/prepare_data.sh

      - name: Install dependencies
        if: steps.spec.outputs.needs_model == 'true'
        env:
          KIND: ${{ inputs.model_type }}
          EXTRA_PIP: ${{ inputs.extra_pip }}
        run: |
          pip install python-crfsuite
          case "$KIND" in
            hf)     pip install torch --index-url https://download.pytorch.org/whl/cpu
                    pip install "transformers[sentencepiece]" ;;
            gliner) pip install torch --index-url https://download.pytorch.org/whl/cpu
                    pip install gliner ;;
            spacy)  pip install spacy ;;
          esac
          if [ -n "$EXTRA_PIP" ]; then pip install $EXTRA_PIP; fi

      - name: Cache model weights
        if: steps.spec.outputs.needs_model == 'true' && inputs.hf_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ inputs.model_type }}-${{ inputs.model }}-${{ inputs.revision }}

      - name: Run NER (fills ner_cache/)
        if: steps.spec.outputs.needs_model == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NER: ${{ steps.spec.outputs.ner }}
        run: |
          args=(); for l in $NER_LABELS; do args+=(--ner-label "$l"); done
          python run.py out/data.jsonl out/submission.jsonl --mode model --ner "$NER" "${args[@]}"

      - uses: actions/upload-artifact@v6
        if: steps.spec.outputs.needs_model == 'true'
        with:
          name: ner-cache
          path: ner_cache/
          if-no-files-found: error

  evaluate:
    name: Evaluate (${{ matrix.mode }})
    needs: ner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(needs.ner.outputs.modes) }}
    env:
      NER: ${{ needs.ner.outputs.ner }}
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        env:
          COSINE: ${{ inputs.cosine }}
        run: |
          pip install python-crfsuite
          if [ "$COSINE" = "true" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
            pip install sentence-transformers
          fi

      - uses: actions/download-artifact@v7
        if: matrix.mode != 'regex'
        with:
          name: ner-cache
          path: ner_cache/

      - name: Prepare data
        run: bash .github/scripts/prepare_data.sh

      - name: Run pipeline
        run: |
          args=(); for l in $NER_LABELS; do args+=(--ner-label "$l"); done
          python run.py out/data.jsonl out/submission.jsonl --mode "$MODE" --ner "$NER" "${args[@]}"

      - name: Result %
        env:
          COSINE: ${{ inputs.cosine }}
          COSINE_MODEL: ${{ inputs.cosine_model }}
          FAIL_BELOW: ${{ inputs.fail_below }}
        run: |
          cos=(); [ "$COSINE" = "true" ] && cos=(--cosine --cosine-model "$COSINE_MODEL")
          python data/evaluate.py out/data.jsonl out/submission.jsonl --json "${cos[@]}" > out/result.json
          {
            echo "### Mode: \`$MODE\`, NER: \`$NER\`${NER_LABELS:+, labels: \`$NER_LABELS\`}"
            echo '```'
            python data/evaluate.py out/data.jsonl out/submission.jsonl "${cos[@]}" 2>/dev/null
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          python - <<'EOF'
          import json, os, sys
          score = 100 * json.load(open("out/result.json", encoding="utf8"))["final_score"]
          print(f"Score: {score:.2f}%")
          m = os.environ.get("FAIL_BELOW")
          if m and score < float(m):
              sys.exit(f"Score {score:.2f}% is below the threshold {float(m):.2f}%")
          EOF

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ner-evaluation-${{ matrix.mode }}
          path: |
            out/submission.jsonl
            out/result.json
          if-no-files-found: ignore

  summary:
    name: Summary
    needs: [ner, evaluate]
    if: always() && needs.ner.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: ner-evaluation-*
          path: results/

      - name: Table
        env:
          NER: ${{ needs.ner.outputs.ner }}
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, json, os
          types = ("ОСОБА", "АДРЕСА", "НОМЕР", "ІНФОРМАЦІЯ")
          print(f"## NER `{os.environ['NER']}`\n")
          print("| Режим | **Бал** | " + " | ".join(types) + " | Strict F1 | Ризик ↓ | B³ F1 | Cosine |")
          print("|---" * (len(types) + 6) + "|")
          for f in sorted(glob.glob("results/ner-evaluation-*/result.json")):
              mode = os.path.basename(os.path.dirname(f)).removeprefix("ner-evaluation-")
              r = json.load(open(f, encoding="utf8"))
              per = r["ner_relaxed"]["per_type"]
              cos = r.get("cosine_similarity")
              print(f"| {mode} | **{r['final_score']:.4f}** | " + " | ".join(f"{per[t]['f1']:.3f}" for t in types)
                    + f" | {r['ner_strict']['macro']['f1']:.4f} | {r['deanonymization_risk_by_name']:.4f}"
                    + f" | {r['consistency_b3']['f1']:.4f} | {'' if cos is None else f'{cos:.4f}'} |")
          EOF

# Evaluation pipeline:
#   Test data ──► detect ──► combine ──► strip ──► check against expected result ──► result %
#                                                       ▲
#   Expected result ────────────────────────────────────┘
#
#   detect   solution/detect.py         кандидати з type, text, metadata.source (ner | regex_persons | rules | crf)
#   combine  solution/combine.py        злиття кандидатів і псевдоніми з номерами (ОСОБА_1 …) + pseudonymized
#   strip    scripts/to_submission.py   лише id, start, end, pseudonym — формат data/evaluate.py
name: Evaluation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      min_score:
        description: "Fail the run if the score (%) is below this value"
        required: false
        default: ""
      use_model:
        description: "Mode 2: model + regex (off = mode 1: only regex)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  TEST_DATA: data/test/court_cases.jsonl   # contains both the inputs and the expected annotations
  MODE: ${{ (github.event_name != 'workflow_dispatch' || inputs.use_model) && 'full' || 'regex' }}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: solution/requirements.txt

      - name: Install dependencies
        if: env.MODE == 'full'
        run: pip install -r solution/requirements.txt

      - name: Cache spaCy model
        if: env.MODE == 'full'
        uses: actions/cache@v5
        with:
          path: solution/models/spacy
          key: spacy-uk_ner_web_trf_13class

      - name: Download spaCy model
        if: env.MODE == 'full'
        run: python solution/download_models.py

      - name: Prepare test data (hide expected result from the flow)
        run: |
          mkdir -p out
          python scripts/split_test_data.py "$TEST_DATA" out/inputs.jsonl

      - name: Check staged flow matches predict.py (regex mode)
        run: |
          python solution/predict.py out/inputs.jsonl out/predict-regex.jsonl --mode regex
          python solution/detect.py out/inputs.jsonl out/candidates-regex.jsonl --mode regex
          python solution/combine.py out/candidates-regex.jsonl out/linked-regex.jsonl
          python scripts/to_submission.py out/linked-regex.jsonl out/submission-regex.jsonl
          cmp out/predict-regex.jsonl out/submission-regex.jsonl

      - name: Detect
        run: python solution/detect.py out/inputs.jsonl out/candidates.jsonl --mode "$MODE"

      - name: Combine (merge and number pseudonyms)
        run: python solution/combine.py out/candidates.jsonl out/linked.jsonl

      - name: Strip extra fields for evaluation
        run: python scripts/to_submission.py out/linked.jsonl out/submission.jsonl

      - name: Check against expected result
        run: python data/evaluate.py "$TEST_DATA" out/submission.jsonl --json > out/result.json

      - name: Result %
        env:
          MIN_SCORE: ${{ inputs.min_score || vars.MIN_SCORE }}
        run: |
          args=()
          if [ -n "$MIN_SCORE" ]; then args+=(--min-score "$MIN_SCORE"); fi
          set -o pipefail
          echo "Mode: \`$MODE\`" >> "$GITHUB_STEP_SUMMARY"
          python scripts/report.py out/result.json "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evaluation-results-${{ env.MODE }}
          path: |
            out/candidates.jsonl
            out/linked.jsonl
            out/submission.jsonl
            out/result.json
          if-no-files-found: ignore

# Evaluation pipeline:
#   Test data ──► run eval script ──► check against expected result ──► result %
#                                          ▲
#   Expected result ───────────────────────┘
name: Evaluation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      min_score:
        description: "Fail the run if the score (%) is below this value"
        required: false
        default: ""

permissions:
  contents: read

env:
  TEST_DATA: data/test/court_cases.jsonl   # contains both the inputs and the expected annotations
  SOLUTION: solution/predict.py            # entry point: python $SOLUTION <inputs.jsonl> <submission.jsonl>

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          for f in requirements.txt solution/requirements.txt; do
            if [ -f "$f" ]; then pip install -r "$f"; fi
          done

      - name: Prepare test data (hide expected result from the solution)
        run: |
          mkdir -p out
          python scripts/split_test_data.py "$TEST_DATA" out/inputs.jsonl

      - name: Run eval script
        run: python "$SOLUTION" out/inputs.jsonl out/submission.jsonl

      - name: Check against expected result
        run: python data/evaluate.py "$TEST_DATA" out/submission.jsonl --json > out/result.json

      - name: Result %
        env:
          MIN_SCORE: ${{ inputs.min_score || vars.MIN_SCORE }}
        run: |
          args=()
          if [ -n "$MIN_SCORE" ]; then args+=(--min-score "$MIN_SCORE"); fi
          set -o pipefail
          python scripts/report.py out/result.json "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evaluation-results
          path: |
            out/submission.jsonl
            out/result.json
          if-no-files-found: ignore

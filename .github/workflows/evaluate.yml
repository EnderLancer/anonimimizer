# Evaluation pipeline:
#   Test data ──► run Regex+model flow ──► check against expected result ──► result %
#                                                ▲
#   Expected result ─────────────────────────────┘
#
# Regex+model flow — RegEx і Model працюють паралельно над оригіналом, кожен пише свої анотації:
#   document ─┬─► RegEx (job: regex) ─┐
#             └─► Model (job: model) ─┴─► Hidden values at positions ─► Mapping values ─► Link results ─► Cleaned document
#                                                                         (job: evaluate, solution/link.py)
name: Evaluation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      min_score:
        description: "Fail the run if the score (%) is below this value"
        required: false
        default: ""
      use_model:
        description: "Run the Model step (off = RegEx only)"
        type: boolean
        default: true
      ner_model:
        description: "Hugging Face NER model for the Model step"
        required: false
        default: "ukr-models/uk-ner"

permissions:
  contents: read

env:
  TEST_DATA: data/test/court_cases.jsonl   # contains both the inputs and the expected annotations
  NER_MODEL: ${{ inputs.ner_model || 'ukr-models/uk-ner' }}

jobs:
  regex:
    name: RegEx
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Prepare test data (hide expected result from the flow)
        run: python scripts/split_test_data.py "$TEST_DATA" inputs.jsonl

      - name: Run RegEx
        run: python solution/regex_annotate.py inputs.jsonl regex.jsonl

      - uses: actions/upload-artifact@v6
        with:
          name: annotations-regex
          path: regex.jsonl

  model:
    name: Model
    if: github.event_name != 'workflow_dispatch' || inputs.use_model
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: solution/requirements.txt

      - name: Install dependencies
        run: pip install -r solution/requirements.txt

      - name: Cache NER model
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.NER_MODEL }}

      - name: Prepare test data (hide expected result from the flow)
        run: python scripts/split_test_data.py "$TEST_DATA" inputs.jsonl

      - name: Run Model
        run: python solution/model_annotate.py inputs.jsonl model.jsonl --model "$NER_MODEL"

      - uses: actions/upload-artifact@v6
        with:
          name: annotations-model
          path: model.jsonl

  evaluate:
    name: Link results and evaluate
    needs: [regex, model]
    # model може бути пропущено (use_model = false), тоді оцінюємо лише RegEx
    if: always() && needs.regex.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.model.result)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v7
        with:
          pattern: annotations-*
          path: out
          merge-multiple: true

      - name: Link results
        run: |
          sources=(out/regex.jsonl)
          if [ -f out/model.jsonl ]; then sources+=(out/model.jsonl); fi
          python solution/link.py out/submission.jsonl "${sources[@]}"

      - name: Check against expected result
        run: |
          for stage in regex model submission; do
            if [ -f "out/$stage.jsonl" ]; then
              python data/evaluate.py "$TEST_DATA" "out/$stage.jsonl" --json > "out/result-$stage.json"
            fi
          done

      - name: Result %
        env:
          MIN_SCORE: ${{ inputs.min_score || vars.MIN_SCORE }}
        run: |
          args=(--compare RegEx=out/result-regex.json)
          if [ -f out/result-model.json ]; then args+=(--compare Model=out/result-model.json); fi
          if [ -n "$MIN_SCORE" ]; then args+=(--min-score "$MIN_SCORE"); fi
          set -o pipefail
          python scripts/report.py out/result-submission.json "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evaluation-results
          path: |
            out/submission.jsonl
            out/result-*.json
          if-no-files-found: ignore

[project]
name = "pseudo"
version = "0.1.0"
description = "Fine-tuning and inference for the Ukrainian court-decision pseudonymizer"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "datasets>=2.20",
    "accelerate>=0.33",
    "pyarrow>=17",
    "sentencepiece>=0.2",
    "protobuf>=4",
    "huggingface-hub>=0.24",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pseudo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

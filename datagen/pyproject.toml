[project]
name = "silver"
version = "0.1.0"
description = "Silver training data generator for the Ukrainian court-decision pseudonymizer"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyarrow>=17",
    "regex>=2024.0",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-uk>=2.4",
    "requests>=2.31",
    "striprtf>=0.0.26",
]

[project.optional-dependencies]
ner = [
    "numpy<2",
    "click>=8",
    "spacy>=3.7,<3.8",
    "spacy-transformers>=1.3",
    "torch>=2.2",
]
osm = [
    "osmium>=4",
    "shapely>=2",
]
orgs = [
    "openpyxl>=3.1",
]
train = [
    "transformers>=4.44",
    "datasets>=2.20",
    "torch>=2.2",
    "accelerate>=0.33",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/silver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../data"]

